<div class="shell">
  <aside class="sidebar" [class.collapsed]="collapsed()">
    <div class="brand">
      @if (collapsed()) {
        <span class="brand-mark" aria-label="Mesa de Servicios">+</span>
      } @else {
        <img src="logo-sistecredito.png" alt="Sistecrédito" />
      }
    </div>

    <nav class="nav" aria-label="Navegación principal">
      <a routerLink="/cases" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" title="Tickets">
        <i class="pi pi-ticket"></i>
        @if (!collapsed()) {
          <span>Tickets</span>
        }
      </a>
    </nav>

    <div class="sidebar-foot">
      <a routerLink="/cases/new" class="new-ticket" title="Nuevo ticket">
        <i class="pi pi-plus"></i>
        @if (!collapsed()) {
          <span>Nuevo ticket</span>
        }
      </a>
      <button
        type="button"
        class="collapse"
        (click)="toggle()"
        [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Contraer menú'"
      >
        <i class="pi" [class.pi-angle-right]="collapsed()" [class.pi-angle-left]="!collapsed()"></i>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar-title">Mesa de Servicios</span>
      <div class="user">
        <div class="avatar user-avatar">{{ initials() }}</div>
        <div class="user-info">
          <p class="user-name">{{ user()?.name }}</p>
          <p class="hint">{{ roleLabel() }}</p>
        </div>
        <p-button
          icon="pi pi-sign-out"
          [text]="true"
          severity="secondary"
          (onClick)="logout()"
          ariaLabel="Cerrar sesión"
          title="Cerrar sesión"
        />
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
